name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Locate project file
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "OpenUtauMobile.csproj" | Select-Object -First 1
          if ($null -eq $proj) {
            Write-Host "❌ 找不到 OpenUtauMobile.csproj"
            exit 1
          }
          Write-Host "✅ 找到: $($proj.FullName)"
          echo "PROJ_PATH=$($proj.FullName)" >> $env:GITHUB_ENV

      - name: Patch main csproj
        shell: pwsh
        run: |
          $projPath = $env:PROJ_PATH
          $content  = Get-Content -Path $projPath -Raw

          $content = $content -replace '(?m)^[^\r\n]*IsOSPlatform[^\r\n]*windows[^\r\n]*\r?\n', ''

          if ($content -match 'android-arm;android-arm64') {
            $content = $content -replace '<RuntimeIdentifiers>android-arm;android-arm64;android-x86;android-x64</RuntimeIdentifiers>',
                                         '<RuntimeIdentifiers>android-arm64</RuntimeIdentifiers>'
            Write-Host "RuntimeIdentifiers -> arm64"
          }

          $old = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish">'
          $new = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish" Condition="$([MSBuild]::GetTargetPlatformIdentifier(''$(TargetFramework)'')) == ''ios''">'
          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
            Write-Host "CopyOpenUtauAssets patched with iOS condition"
          }

          Set-Content -Path $projPath -Value $content -NoNewline

      - name: Create missing SVG placeholders (with real geometry, not empty)
        shell: pwsh
        run: |
          # 重要：占位SVG必须包含实际图形内容（哪怕只是一个矩形），
          # 完全空白的 <svg></svg> 在 MAUI 的图标光栅化工具里有很高概率直接报错崩溃，
          # 尤其是 MauiIcon（App图标，处理逻辑比普通图标复杂）。
          $minSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="#888888"/></svg>'
          $allProjs = Get-ChildItem -Path . -Recurse -Filter "*.csproj"
          Write-Host "共找到 $($allProjs.Count) 个 csproj，开始扫描缺失 SVG..."

          foreach ($proj in $allProjs) {
            $projContent = Get-Content -Path $proj.FullName -Raw
            $projDir     = Split-Path -Parent $proj.FullName

            $refs = [regex]::Matches($projContent, '(?:Include|ForegroundFile)="([^"]+\.svg)"')
            foreach ($m in $refs) {
              $rel = $m.Groups[1].Value
              if ($rel -match '[*?]') { continue }
              $full = Join-Path $projDir $rel
              if (-not (Test-Path $full)) {
                $dir = Split-Path -Parent $full
                if ($dir -and -not (Test-Path $dir)) {
                  New-Item -ItemType Directory -Path $dir -Force | Out-Null
                }
                Set-Content -Path $full -Value $minSvg -NoNewline
                Write-Host "补充占位 SVG: $rel  [$($proj.Name)]"
              }
            }
          }
          Write-Host "全部 SVG 占位检查完成"

      - name: Restore
        run: dotnet restore "${{ env.PROJ_PATH }}"

      - name: Build APK
        id: buildstep
        shell: pwsh
        run: |
          # 把完整编译日志写进文件，无论成功还是失败，后面都会作为附件上传，
          # 这样你不用再对着手机小屏幕翻日志、截图发我了，直接下载这个txt文件看就行。
          dotnet build "${{ env.PROJ_PATH }}" -f net9.0-android -c Release *>&1 |
            Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ 构建失败，退出码 $LASTEXITCODE，完整日志见 build_log.txt 附件"
            exit $LASTEXITCODE
          }

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-apk
          path: |
            **/bin/**/*.apk
            !**/obj/**
          if-no-files-found: error

