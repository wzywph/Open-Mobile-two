name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Locate project file
        id: findproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "OpenUtauMobile.csproj" | Select-Object -First 1
          if ($null -eq $proj) { Write-Host "❌ 没找到 OpenUtauMobile.csproj"; exit 1 }
          Write-Host "✅ 找到：$($proj.FullName)"
          echo "PROJ_PATH=$($proj.FullName)" >> $env:GITHUB_ENV

      - name: Patch csproj (remove Windows TFM, skip iOS asset copy, arm64 only)
        shell: pwsh
        run: |
          $path = $env:PROJ_PATH
          $content = Get-Content -Path $path -Raw

          # 1) 删除 Windows 目标框架（用正则，不管缩进/换行/空格差异）
          $before = $content
          $content = $content -replace '<TargetFrameworks[^>]*Condition="\$\(\[MSBuild\]::IsOSPlatform\([^)]*windows[^)]*\)\)"[^>]*>\$\(TargetFrameworks\);net9\.0-windows[^<]*</TargetFrameworks>\s*', ''
          if ($content -ne $before) { Write-Host "✅ 已删除 Windows 目标框架。" } else { Write-Host "⚠️ 未匹配到 Windows TFM 行，请检查 csproj。" }

          # 2) 跳过 Android 构建时的 iOS 资源复制
          $old1 = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish">'
          $new1 = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish" Condition="$([MSBuild]::GetTargetPlatformIdentifier(''$(TargetFramework)'')) == ''ios''">'
          if ($content.Contains($old1)) { $content = $content.Replace($old1, $new1); Write-Host "✅ CopyOpenUtauAssets 已修补。" }

          # 3) 只打 arm64
          $content = $content -replace '<RuntimeIdentifiers>android-arm;android-arm64;android-x86;android-x64</RuntimeIdentifiers>', '<RuntimeIdentifiers>android-arm64</RuntimeIdentifiers>'
          Write-Host "✅ RuntimeIdentifiers → android-arm64。"

          Set-Content -Path $path -Value $content -NoNewline

      - name: Patch AI note-writing bug
        shell: pwsh
        run: |
          $projDir = Split-Path -Parent $env:PROJ_PATH
          $editVmPath = Join-Path $projDir "ViewModels/EditViewModel.cs"
          if (-not (Test-Path $editVmPath)) { Write-Host "⚠️ 未找到 EditViewModel.cs"; return }
          $content = Get-Content -Path $editVmPath -Raw
          $patched = $false

          $old1 = @('                UNote newNote = new UNote()','                {','                    tone = tone,','                    tempo = 0,','                    position = position,','                    durTick = duration,','                    lyric = lyric,','                };','                EditingPart.notes.Add(newNote);') -join "`n"
          $new1 = @('                UNote newNote = UNote.Create();','                newNote.tone = tone;','                newNote.position = position;','                newNote.duration = duration;','                newNote.lyric = lyric;','                EditingPart.notes.Add(newNote);') -join "`n"
          if ($content.Contains($old1)) { $content = $content.Replace($old1, $new1); $patched = $true; Write-Host "✅ add_notes 已修复。" }

          $old2 = 'if (mod.Duration.HasValue) note.durTick = mod.Duration.Value;'
          $new2 = 'if (mod.Duration.HasValue) note.duration = mod.Duration.Value;'
          if ($content.Contains($old2)) { $content = $content.Replace($old2, $new2); $patched = $true }

          $old3 = 'if (action.Duration.HasValue) targetNote.durTick = action.Duration.Value;'
          $new3 = 'if (action.Duration.HasValue) targetNote.duration = action.Duration.Value;'
          if ($content.Contains($old3)) { $content = $content.Replace($old3, $new3); $patched = $true }

          if ($patched) { Set-Content -Path $editVmPath -Value $content -NoNewline; Write-Host "✅ durTick → duration 全部修正。" }

      - name: Patch AI reply JSON parsing
        shell: pwsh
        run: |
          $projDir = Split-Path -Parent $env:PROJ_PATH
          $servicePath = Join-Path $projDir "Utils/DeepSeekService.cs"
          if (-not (Test-Path $servicePath)) { Write-Host "⚠️ 未找到 DeepSeekService.cs"; return }
          $content = Get-Content -Path $servicePath -Raw

          $old = @('            // 尝试提取 JSON（AI 可能用 ```json ``` 包裹）','            if (reply.Contains("```")) {','                var start = reply.IndexOf("```json") + 7;','                if (start < 7) start = reply.IndexOf("```") + 3;','                var end = reply.LastIndexOf("```");','                if (start >= 0 && end > start) {','                    reply = reply.Substring(start, end - start).Trim();','                }','            }','','            return reply;') -join "`n"
          $new = @('            // 尝试提取 JSON（AI 可能用 ```json ``` 包裹）','            if (reply.Contains("```")) {','                var start = reply.IndexOf("```json") + 7;','                if (start < 7) start = reply.IndexOf("```") + 3;','                var end = reply.LastIndexOf("```");','                if (start >= 0 && end > start) {','                    reply = reply.Substring(start, end - start).Trim();','                }','            }','','            reply = reply.Trim();','            if (!reply.StartsWith("{")) {','                var jsonStart = reply.IndexOf(''{'');','                var jsonEnd = reply.LastIndexOf(''}'');','                if (jsonStart >= 0 && jsonEnd > jsonStart) {','                    reply = reply.Substring(jsonStart, jsonEnd - jsonStart + 1).Trim();','                }','            }','','            return reply;') -join "`n"
          if ($content.Contains($old)) { $content = $content.Replace($old, $new); Set-Content -Path $servicePath -Value $content -NoNewline; Write-Host "✅ JSON 解析容错已增强。" }

      - name: Restore
        run: dotnet restore "${{ env.PROJ_PATH }}"

      - name: Build APK
        run: dotnet build "${{ env.PROJ_PATH }}" -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-apk
          path: |
            **/bin/**/*.apk
            !**/obj/**
          if-no-files-found: error
