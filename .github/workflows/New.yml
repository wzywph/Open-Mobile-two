name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Locate project file
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "OpenUtauMobile.csproj" | Select-Object -First 1
          if ($null -eq $proj) {
            Write-Host "❌ 找不到 OpenUtauMobile.csproj"
            exit 1
          }
          Write-Host "✅ 找到: $($proj.FullName)"
          echo "PROJ_PATH=$($proj.FullName)" >> $env:GITHUB_ENV

      - name: Fix AI notes rendering trigger in EditViewModel.cs
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Recurse -Filter "EditViewModel.cs" | Select-Object -First 1
          if ($file) {
            $content = Get-Content -Path $file.FullName -Raw
            
            # 在 ExecuteAddNotes 的 return 前添加渲染触发
            $oldAdd = 'return \$"✅ 已添加 \{count\} 个音符到分片 \\"\\{EditingPart\.DisplayName\\}\\"。";'
            $newAdd = '            DocManager.Inst.ExecuteCmd(new PartCommand(DocManager.Inst.Project, EditingPart));' + "`r`n" + '            return $"✅ 已添加 {count} 个音符到分片 \"{EditingPart.DisplayName}\"。";'
            $content = $content -replace $oldAdd, $newAdd
            
            # 在 ExecuteRemoveNotes 的第一个 return 前添加渲染触发（清空所有音符分支）
            $oldRemove1 = 'return \$"✅ 已清空分片中的所有音符。";'
            $newRemove1 = '                DocManager.Inst.ExecuteCmd(new PartCommand(DocManager.Inst.Project, EditingPart));' + "`r`n" + '                return $"✅ 已清空分片中的所有音符。";'
            $content = $content -replace $oldRemove1, $newRemove1
            
            # 在 ExecuteRemoveNotes 的第二个 return 前添加渲染触发（按索引删除分支）
            $oldRemove2 = 'return \$"✅ 已删除 \{count\} 个音符。";'
            $newRemove2 = '                DocManager.Inst.ExecuteCmd(new PartCommand(DocManager.Inst.Project, EditingPart));' + "`r`n" + '                return $"✅ 已删除 {count} 个音符。";'
            $content = $content -replace $oldRemove2, $newRemove2
            
            # 在 ExecuteModifyNotes 的两个 return 前添加渲染触发
            $oldModify1 = 'return \$"✅ 已修改 \{modifiedCount\} 个音符。";'
            $newModify1 = '                DocManager.Inst.ExecuteCmd(new PartCommand(DocManager.Inst.Project, EditingPart));' + "`r`n" + '                return $"✅ 已修改 {modifiedCount} 个音符。";'
            $content = $content -replace $oldModify1, $newModify1
            
            $oldModify2 = 'return \$"✅ 已修改音符（索引 \{action\.NoteIndex\.Value\}）。";'
            $newModify2 = '            DocManager.Inst.ExecuteCmd(new PartCommand(DocManager.Inst.Project, EditingPart));' + "`r`n" + '            return $"✅ 已修改音符（索引 {action.NoteIndex.Value}）。";'
            $content = $content -replace $oldModify2, $newModify2
            
            Set-Content -Path $file.FullName -Value $content -NoNewline
            Write-Host "✅ 已修复 AI 音符操作后的渲染触发"
          }

      - name: Fix Preferences ambiguity in DeepSeekService.cs
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Recurse -Filter "DeepSeekService.cs" | Select-Object -First 1
          if ($file) {
            $content = Get-Content -Path $file.FullName -Raw
            $content = $content -replace 'using OpenUtau\.Core\.Util;', 'using Prefs = OpenUtau.Core.Util.Preferences;'
            $content = $content -replace '\bPreferences\.Default\.', 'Prefs.Default.'
            Set-Content -Path $file.FullName -Value $content -NoNewline
            Write-Host "✅ 已修复 DeepSeekService.cs 的 Preferences 歧义"
          }

      - name: Fix SortedSet index access in EditViewModel.cs
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Recurse -Filter "EditViewModel.cs" | Select-Object -First 1
          if ($file) {
            $content = Get-Content -Path $file.FullName -Raw
            $content = $content -replace 'EditingPart\.notes\[idx\]', 'EditingPart.notes.ElementAt(idx)'
            $content = $content -replace 'EditingPart\.notes\[mod\.Index\]', 'EditingPart.notes.ElementAt(mod.Index)'
            $content = $content -replace 'EditingPart\.notes\[action\.NoteIndex\.Value\]', 'EditingPart.notes.ElementAt(action.NoteIndex.Value)'
            Set-Content -Path $file.FullName -Value $content -NoNewline
            Write-Host "✅ 已修复 EditViewModel.cs 的 SortedSet 下标访问"
          }

      - name: Clean stray AI control tokens from all .cs files
        shell: pwsh
        run: |
          $pattern = '<\/?｜[^>]*>'
          $files = Get-ChildItem -Path . -Recurse -Filter "*.cs" -File
          $fixedCount = 0
          foreach ($f in $files) {
            $text = Get-Content -Path $f.FullName -Raw -ErrorAction SilentlyContinue
            if ($null -ne $text -and $text -match $pattern) {
              $newText = [regex]::Replace($text, $pattern, '')
              Set-Content -Path $f.FullName -Value $newText -NoNewline
              Write-Host "🧹 清理了乱码符号: $($f.FullName)"
              $fixedCount++
            }
          }
          Write-Host "共清理 $fixedCount 个文件"

      - name: Patch main csproj
        shell: pwsh
        run: |
          $projPath = $env:PROJ_PATH
          $content  = Get-Content -Path $projPath -Raw

          $content = $content -replace '(?m)^[^\r\n]*IsOSPlatform[^\r\n]*windows[^\r\n]*\r?\n', ''

          if ($content -match 'android-arm;android-arm64') {
            $content = $content -replace '<RuntimeIdentifiers>android-arm;android-arm64;android-x86;android-x64</RuntimeIdentifiers>',
                                         '<RuntimeIdentifiers>android-arm64</RuntimeIdentifiers>'
            Write-Host "RuntimeIdentifiers -> arm64"
          }

          $old = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish">'
          $new = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish" Condition="$([MSBuild]::GetTargetPlatformIdentifier(''$(TargetFramework)'')) == ''ios''">'
          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
            Write-Host "CopyOpenUtauAssets patched with iOS condition"
          }

          Set-Content -Path $projPath -Value $content -NoNewline

      - name: Create missing SVG placeholders (with real geometry, not empty)
        shell: pwsh
        run: |
          $minSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="#888888"/></svg>'
          $allProjs = Get-ChildItem -Path . -Recurse -Filter "*.csproj"
          Write-Host "共找到 $($allProjs.Count) 个 csproj，开始扫描缺失 SVG..."

          foreach ($proj in $allProjs) {
            $projContent = Get-Content -Path $proj.FullName -Raw
            $projDir     = Split-Path -Parent $proj.FullName

            $refs = [regex]::Matches($projContent, '(?:Include|ForegroundFile)="([^"]+\.svg)"')
            foreach ($m in $refs) {
              $rel = $m.Groups[1].Value
              if ($rel -match '[*?]') { continue }
              $full = Join-Path $projDir $rel
              if (-not (Test-Path $full)) {
                $dir = Split-Path -Parent $full
                if ($dir -and -not (Test-Path $dir)) {
                  New-Item -ItemType Directory -Path $dir -Force | Out-Null
                }
                Set-Content -Path $full -Value $minSvg -NoNewline
                Write-Host "补充占位 SVG: $rel  [$($proj.Name)]"
              }
            }
          }
          Write-Host "全部 SVG 占位检查完成"

      - name: Restore
        run: dotnet restore "${{ env.PROJ_PATH }}"

      - name: Build APK
        id: buildstep
        shell: pwsh
        run: |
          dotnet build "${{ env.PROJ_PATH }}" -c Release *>&1 |
            Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ 构建失败，退出码 $LASTEXITCODE，完整日志见 build_log.txt 附件"
            exit $LASTEXITCODE
          }

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-apk
          path: |
            **/bin/**/*.apk
            !**/obj/**
          if-no-files-found: error
