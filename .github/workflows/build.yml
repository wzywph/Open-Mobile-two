name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj

      - name: Build
        run: dotnet build OpenUtauMobile/OpenUtauMobile.csproj -c Release

      - name: Publish
        run: dotnet publish OpenUtauMobile/OpenUtauMobile.csproj -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-android
          path: |
            **/bin/**/*.apk
            !**/obj/**
          if-no-files-found: error
