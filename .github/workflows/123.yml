name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Locate project file
        id: findproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "OpenUtauMobile.csproj" | Select-Object -First 1
          if ($null -eq $proj) {
            Write-Host "❌ 在仓库里没找到 OpenUtauMobile.csproj。"
            Write-Host "当前仓库根目录内容："
            Get-ChildItem -Path . -Force | Format-Table Name
            exit 1
          }
          Write-Host "✅ 找到项目文件：$($proj.FullName)"
          echo "PROJ_PATH=$($proj.FullName)" >> $env:GITHUB_ENV

      - name: Patch csproj (skip iOS-only asset copy on Android build; only build arm64 to shrink output)
        shell: pwsh
        run: |
          $path = $env:PROJ_PATH
          $content = Get-Content -Path $path -Raw

          $old1 = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish">'
          $new1 = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish" Condition="$([MSBuild]::GetTargetPlatformIdentifier(''$(TargetFramework)'')) == ''ios''">'
          if ($content.Contains($old1)) {
            $content = $content.Replace($old1, $new1)
            Write-Host "✅ 已修补 csproj，跳过 Android 构建时的 iOS 图标复制步骤。"
          } else {
            Write-Host "ℹ️ 未找到需要修补的内容（可能已经修过了），跳过此步骤。"
          }

          $old2 = '<RuntimeIdentifiers>android-arm;android-arm64;android-x86;android-x64</RuntimeIdentifiers>'
          $new2 = '<RuntimeIdentifiers>android-arm64</RuntimeIdentifiers>'
          if ($content.Contains($old2)) {
            $content = $content.Replace($old2, $new2)
            Write-Host "✅ 已修补 csproj，只为 arm64 构建 APK（原来是 arm/arm64/x86/x64 四个架构一起打包导致产物体积虚高到 3GB；真机基本都是 arm64，改成只 build 这一个架构后产物应该会接近你本机实际安装的约 200MB）。"
          } else {
            Write-Host "ℹ️ 未找到 RuntimeIdentifiers 配置（可能已经修过了），跳过此步骤。"
          }

          Set-Content -Path $path -Value $content -NoNewline

      - name: Patch AI note-writing bug (UNote.Create + durTick/tempo field name mismatch)
        shell: pwsh
        run: |
          $projDir = Split-Path -Parent $env:PROJ_PATH
          $editVmPath = Join-Path $projDir "ViewModels/EditViewModel.cs"

          if (-not (Test-Path $editVmPath)) {
            Write-Host "⚠️ 没找到 EditViewModel.cs（路径：$editVmPath），跳过 AI 音符 bug 修复。"
          } else {
            $content = Get-Content -Path $editVmPath -Raw
            $patched = $false

            $old1 = @(
              '                UNote newNote = new UNote()',
              '                {',
              '                    tone = tone,',
              '                    tempo = 0,',
              '                    position = position,',
              '                    durTick = duration,',
              '                    lyric = lyric,',
              '                };',
              '                EditingPart.notes.Add(newNote);'
            ) -join "`n"
            $new1 = @(
              '                UNote newNote = UNote.Create();',
              '                newNote.tone = tone;',
              '                newNote.position = position;',
              '                newNote.duration = duration;',
              '                newNote.lyric = lyric;',
              '                EditingPart.notes.Add(newNote);'
            ) -join "`n"
            if ($content.Contains($old1)) {
              $content = $content.Replace($old1, $new1)
              $patched = $true
              Write-Host "✅ 已修复 add_notes：改用 UNote.Create() 正确初始化音符，并修正 tempo/durTick 字段名。"
            } else {
              Write-Host "ℹ️ 未找到 add_notes 的旧代码（可能已经修过了）。"
            }

            $old2 = 'if (mod.Duration.HasValue) note.durTick = mod.Duration.Value;'
            $new2 = 'if (mod.Duration.HasValue) note.duration = mod.Duration.Value;'
            if ($content.Contains($old2)) {
              $content = $content.Replace($old2, $new2)
              $patched = $true
              Write-Host "✅ 已修复批量修改音符（modifications 数组）里的 durTick 字段名。"
            } else {
              Write-Host "ℹ️ 未找到批量修改的旧代码（可能已经修过了）。"
            }

            $old3 = 'if (action.Duration.HasValue) targetNote.durTick = action.Duration.Value;'
            $new3 = 'if (action.Duration.HasValue) targetNote.duration = action.Duration.Value;'
            if ($content.Contains($old3)) {
              $content = $content.Replace($old3, $new3)
              $patched = $true
              Write-Host "✅ 已修复单个修改音符（兼容旧格式）里的 durTick 字段名。"
            } else {
              Write-Host "ℹ️ 未找到单个修改的旧代码（可能已经修过了）。"
            }

            if ($patched) {
              Set-Content -Path $editVmPath -Value $content -NoNewline
            }
          }

      - name: Patch AI reply JSON parsing (make it tolerant of extra text around the JSON)
        shell: pwsh
        run: |
          $projDir = Split-Path -Parent $env:PROJ_PATH
          $servicePath = Join-Path $projDir "Utils/DeepSeekService.cs"

          if (-not (Test-Path $servicePath)) {
            Write-Host "⚠️ 没找到 DeepSeekService.cs（路径：$servicePath），跳过 JSON 解析容错修复。"
          } else {
            $content = Get-Content -Path $servicePath -Raw

            $old = @(
              '            // 尝试提取 JSON（AI 可能用 ```json ``` 包裹）',
              '            if (reply.Contains("```")) {',
              '                var start = reply.IndexOf("```json") + 7;',
              '                if (start < 7) start = reply.IndexOf("```") + 3;',
              '                var end = reply.LastIndexOf("```");',
              '                if (start >= 0 && end > start) {',
              '                    reply = reply.Substring(start, end - start).Trim();',
              '                }',
              '            }',
              '',
              '            return reply;'
            ) -join "`n"
            $new = @(
              '            // 尝试提取 JSON（AI 可能用 ```json ``` 包裹）',
              '            if (reply.Contains("```")) {',
              '                var start = reply.IndexOf("```json") + 7;',
              '                if (start < 7) start = reply.IndexOf("```") + 3;',
              '                var end = reply.LastIndexOf("```");',
              '                if (start >= 0 && end > start) {',
              '                    reply = reply.Substring(start, end - start).Trim();',
              '                }',
              '            }',
              '',
              '            reply = reply.Trim();',
              '            // 兜底：如果开头不是 {，说明 AI 在 JSON 前后夹了说明文字（且没用代码块包裹），',
              '            // 截取第一个 { 到最后一个 } 之间的内容再当 JSON 用。',
              '            if (!reply.StartsWith("{")) {',
              '                var jsonStart = reply.IndexOf(''{'');',
              '                var jsonEnd = reply.LastIndexOf(''}'');',
              '                if (jsonStart >= 0 && jsonEnd > jsonStart) {',
              '                    reply = reply.Substring(jsonStart, jsonEnd - jsonStart + 1).Trim();',
              '                }',
              '            }',
              '',
              '            return reply;'
            ) -join "`n"
            if ($content.Contains($old)) {
              $content = $content.Replace($old, $new)
              Set-Content -Path $servicePath -Value $content -NoNewline
              Write-Host "✅ 已增强 AI 回复的 JSON 提取容错。"
            } else {
              Write-Host "ℹ️ 未找到需要修补的内容（可能已经修过了），跳过此步骤。"
            }
          }

      - name: Restore
        run: dotnet restore "${{ env.PROJ_PATH }}"

      - name: Build APK
        run: dotnet build "${{ env.PROJ_PATH }}" -f net9.0-android -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-apk
          path: |
            **/bin/**/*.apk
            !**/obj/**
          if-no-files-found: error
