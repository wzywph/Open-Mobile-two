name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Install MAUI workload
      run: dotnet workload install maui-android
    
    - name: Locate project file
      run: |
        $csproj = Get-ChildItem -Recurse -Filter "OpenUtauMobile.csproj" | Select-Object -First 1
        if (-not $csproj) { throw "OpenUtauMobile.csproj not found" }
        echo "CSPROJ_PATH=$($csproj.FullName)" >> $env:GITHUB_ENV
    
    - name: Fix AI thread safety
      shell: pwsh
      run: |
        $file = "$env:GITHUB_WORKSPACE\\OpenUtauMobile\\ViewModels\\EditViewModel.cs"
        $content = Get-Content $file -Raw -Encoding UTF8
        $old1 = 'DocManager.Inst.StartUndoGroup();'+[char]13+[char]10+'            DocManager.Inst.ExecuteCmd(new AddNoteCommand(EditingPart, notesToAdd));'+[char]13+[char]10+'            DocManager.Inst.EndUndoGroup();'
        $new1 = 'MainThread.InvokeOnMainThreadAsync(() => {'+[char]13+[char]10+'                DocManager.Inst.StartUndoGroup();'+[char]13+[char]10+'                DocManager.Inst.ExecuteCmd(new AddNoteCommand(EditingPart, notesToAdd));'+[char]13+[char]10+'                DocManager.Inst.EndUndoGroup();'+[char]13+[char]10+'            }).Wait();'
        $content = $content.Replace($old1, $new1)
        $old2 = 'DocManager.Inst.StartUndoGroup();'+[char]13+[char]10+'                DocManager.Inst.ExecuteCmd(new RemoveNoteCommand(EditingPart, allNotes));'+[char]13+[char]10+'                DocManager.Inst.EndUndoGroup();'
        $new2 = 'MainThread.InvokeOnMainThreadAsync(() => {'+[char]13+[char]10+'                    DocManager.Inst.StartUndoGroup();'+[char]13+[char]10+'                    DocManager.Inst.ExecuteCmd(new RemoveNoteCommand(EditingPart, allNotes));'+[char]13+[char]10+'                    DocManager.Inst.EndUndoGroup();'+[char]13+[char]10+'                }).Wait();'
        $content = $content.Replace($old2, $new2)
        $old3 = 'DocManager.Inst.StartUndoGroup();'+[char]13+[char]10+'                DocManager.Inst.ExecuteCmd(new RemoveNoteCommand(EditingPart, notesToRemove));'+[char]13+[char]10+'                DocManager.Inst.EndUndoGroup();'
        $new3 = 'MainThread.InvokeOnMainThreadAsync(() => {'+[char]13+[char]10+'                    DocManager.Inst.StartUndoGroup();'+[char]13+[char]10+'                    DocManager.Inst.ExecuteCmd(new RemoveNoteCommand(EditingPart, notesToRemove));'+[char]13+[char]10+'                    DocManager.Inst.EndUndoGroup();'+[char]13+[char]10+'                }).Wait();'
        $content = $content.Replace($old3, $new3)
        $content | Set-Content $file -Encoding UTF8 -NoNewline
    
    - name: Fix Preferences
      shell: pwsh
      run: |
        $file = "$env:GITHUB_WORKSPACE\\OpenUtauMobile\\ViewModels\\EditViewModel.cs"
        $content = Get-Content $file -Raw -Encoding UTF8
        if ($content -notmatch 'using Preferences = OpenUtau') {
          $content = $content -replace '(using ReactiveUI;)', "`$1`r`nusing Preferences = OpenUtau.Core.Util.Preferences;"
          $content | Set-Content $file -Encoding UTF8 -NoNewline
        }
    
    - name: Fix SortedSet
      shell: pwsh
      run: |
        $file = "$env:GITHUB_WORKSPACE\\OpenUtauMobile\\ViewModels\\EditViewModel.cs"
        (Get-Content $file -Raw -Encoding UTF8) -replace 'SelectedNotes\[0\]', 'SelectedNotes.First()' | Set-Content $file -Encoding UTF8 -NoNewline
    
    - name: Patch csproj
      shell: pwsh
      run: |
        $csproj = "$env:GITHUB_WORKSPACE\\OpenUtauMobile\\OpenUtauMobile.csproj"
        $xml = [xml](Get-Content $csproj -Raw)
        foreach ($pg in $xml.Project.PropertyGroup) {
          if ($pg.ApplicationId -eq 'com.companyname.openutaumobile') {
            $pg.ApplicationId = 'pers.vocoder712.openutaumobile'
            $xml.Save($csproj)
            break
          }
        }
    
    - name: Create all SVG files at exact paths
      shell: pwsh
      run: |
        $svg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><rect x="0" y="0" width="24" height="24" fill="#888888"/></svg>'
        $root = "$env:GITHUB_WORKSPACE\\OpenUtauMobile"
        $sources = Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in '.csproj','.xaml','.cs' }
        $refs = @()
        foreach ($f in $sources) {
          $c = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
          if ($c) {
            [regex]::Matches($c, '[A-Za-z0-9_\\/.-]+\.svg') | ForEach-Object { $refs += $_.Groups[0].Value }
          }
        }
        $refs = $refs | Where-Object { $_ -match '\.svg$' } | Select-Object -Unique
        Write-Host "SVG refs found: $($refs.Count)"
        foreach ($r in $refs) {
          $rel = $null
          foreach ($sep in @('Resources\', 'Resources/')) {
            $idx = $r.IndexOf($sep)
            if ($idx -ge 0) { $rel = $r.Substring($idx); break }
          }
          if ($rel) {
            $rel = $rel.Replace('/', '\')
            $p = Join-Path $root $rel
          } else {
            $p = Join-Path $root (Join-Path 'Resources\Images' $r)
          }
          if (!(Test-Path $p)) {
            $parent = Split-Path $p
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            $svg | Out-File $p -Encoding UTF8 -NoNewline
            Write-Host "Created: $p"
          }
        }
    
    - name: Restore
      run: dotnet restore "$env:CSPROJ_PATH"
    
    - name: Build
      run: dotnet build "$env:CSPROJ_PATH" -c Release -p:AndroidPackageFormats=apk -p:AndroidKeyStore=false | Tee-Object build_log.txt
    
    - name: Upload log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build_log.txt
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: "**/*-Signed.apk"
