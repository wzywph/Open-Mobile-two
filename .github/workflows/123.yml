name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Locate project file
        id: findproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "OpenUtauMobile.csproj" | Select-Object -First 1
          if ($null -eq $proj) {
            Write-Host "❌ 在仓库里没找到 OpenUtauMobile.csproj。"
            Write-Host "当前仓库根目录内容："
            Get-ChildItem -Path . -Force | Format-Table Name
            exit 1
          }
          Write-Host "✅ 找到项目文件：$($proj.FullName)"
          echo "PROJ_PATH=$($proj.FullName)" >> $env:GITHUB_ENV

      - name: Patch csproj (skip iOS-only asset copy on Android build; only build arm64 to shrink output)
        shell: pwsh
        run: |
          $path = $env:PROJ_PATH
          $content = Get-Content -Path $path -Raw

          # 删除 Windows 条件 TargetFrameworks 行
          if ($content -match 'IsOSPlatform.*windows.*TargetFrameworks') {
            $content = $content -replace '[\r\n]+.*IsOSPlatform.*windows.*TargetFrameworks.*', ''
            Write-Host "✅ 已删除 Windows 条件 TargetFrameworks 行。"
          } else {
            Write-Host "ℹ️ Windows TFM 已不存在（可能已经修过了）。"
          }

          # 删除缺失的 svg 引用
          if ($content -match 'MauiSplashScreen.*splash\.svg') {
            $content = $content -replace '[\r\n]+.*MauiSplashScreen.*splash\.svg.*', ''
            Write-Host "✅ 已删除 splash.svg 引用。"
          } else {
            Write-Host "ℹ️ splash.svg 引用已不存在。"
          }

          if ($content -match 'MauiImage.*bxs_rename_dark') {
            $content = $content -replace '[\r\n]+.*MauiImage.*bxs_rename_dark.*', ''
            Write-Host "✅ 已删除 bxs_rename_dark.svg 引用。"
          } else {
            Write-Host "ℹ️ bxs_rename_dark.svg 引用已不存在。"
          }

          $old1 = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish">'
          $new1 = '<Target Name="CopyOpenUtauAssets" AfterTargets="Build;Publish" Condition="$([MSBuild]::GetTargetPlatformIdentifier(''$(TargetFramework)'')) == ''ios''">'
          if ($content.Contains($old1)) {
            $content = $content.Replace($old1, $new1)
            Write-Host "✅ 已修补 csproj，跳过 Android 构建时的 iOS 图标复制步骤。"
          } else {
            Write-Host "ℹ️ 未找到需要修补的内容（可能已经修过了），跳过此步骤。"
          }

          $old2 = '<RuntimeIdentifiers>android-arm;android-arm64;android-x86;android-x64</RuntimeIdentifiers>'
          $new2 = '<RuntimeIdentifiers>android-arm64</RuntimeIdentifiers>'
          if ($content.Contains($old2)) {
            $content = $content.Replace($old2, $new2)
            Write-Host "✅ 已修补 csproj，只为 arm64 构建 APK。"
          } else {
            Write-Host "ℹ️ 未找到 RuntimeIdentifiers 配置（可能已经修过了），跳过此步骤。"
          }

          Set-Content -Path $path -Value $content -NoNewline

      - name: Patch AI note-writing bug (UNote.Create + durTick/tempo field name mismatch)
        shell: pwsh
        run: |
          $projDir = Split-Path -Parent $env:PROJ_PATH
          $editVmPath = Join-Path $projDir "ViewModels/EditViewModel.cs"

          if (-not (Test-Path $editVmPath)) {
            Write-Host "⚠️ 没找到 EditViewModel.cs，跳过 AI 音符 bug 修复。"
          } else {
            $content = Get-Content -Path $editVmPath -Raw
            
            # 检测是否已修复（含 UNote.Create() 说明已经是新版）
            if ($content -match 'UNote\.Create\(\)') {
              Write-Host "ℹ️ EditViewModel.cs 已包含 UNote.Create()，AI 音符修复已存在。"
            } else {
              Write-Host "⚠️ EditViewModel.cs 未检测到修复代码，但为避免冲突跳过自动修复。"
            }
          }

      - name: Patch AI reply JSON parsing (make it tolerant of extra text around the JSON)
        shell: pwsh
        run: |
          $projDir = Split-Path -Parent $env:PROJ_PATH
          $servicePath = Join-Path $projDir "Utils/DeepSeekService.cs"

          if (-not (Test-Path $servicePath)) {
            Write-Host "⚠️ 没找到 DeepSeekService.cs，跳过 JSON 解析容错修复。"
          } else {
            $content = Get-Content -Path $servicePath -Raw
            
            # 检测是否已修复
            if ($content -match 'IndexOf.*\{.*LastIndexOf.*\}') {
              Write-Host "ℹ️ DeepSeekService.cs 已包含 JSON 截取逻辑，容错已存在。"
            } else {
              Write-Host "⚠️ DeepSeekService.cs 未检测到修复代码，但为避免冲突跳过自动修复。"
            }
          }

      - name: Restore
        run: dotnet restore "${{ env.PROJ_PATH }}"

      - name: Build APK
        run: dotnet build "${{ env.PROJ_PATH }}" -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-apk
          path: |
            **/bin/**/*.apk
            !**/obj/**
          if-no-files-found: error
