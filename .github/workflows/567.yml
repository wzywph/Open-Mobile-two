name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Patch csproj
        shell: powershell
        run: |
          $csproj = "OpenUtauMobile/OpenUtauMobile.csproj"
          $content = Get-Content $csproj -Raw

          # 1. 删除 Windows 目标框架行（正则，不管格式怎么变）
          $content = $content -replace "`r`n.*\<TargetFrameworks\>.*;net9\.0-windows.*\</TargetFrameworks\>", ""

          # 2. 删除 MauiSplashScreen 引用（splash.svg 不存在，不删必报 MSB3954）
          $content = $content -replace "`r`n.*\<MauiSplashScreen\s+Include=.*Splash.*/\>", ""

          # 3. RuntimeIdentifiers 收缩为 arm64 单架构
          $content = $content -replace '<RuntimeIdentifiers>android-arm;android-arm64;android-x86;android-x64</RuntimeIdentifiers>', '<RuntimeIdentifiers>android-arm64</RuntimeIdentifiers>'

          Set-Content $csproj $content -NoNewline
          Write-Host "csproj patched successfully"

      - name: Restore
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj

      - name: Build
        run: dotnet build OpenUtauMobile/OpenUtauMobile.csproj -c Release

      - name: Publish
        run: dotnet publish OpenUtauMobile/OpenUtauMobile.csproj -c Release -p:RuntimeIdentifier=android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-arm64
          path: |
            **/bin/**/*.apk
            !**/obj/**
          if-no-files-found: error
